# Builds and tests the native binaries. On a v* tag it attaches both to the
# GitHub release (claudetalk.exe downloads claudetalk-dictation.exe from the
# release of its own version) and opens a PR that refreshes bin/claudetalk.exe.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["native/**", ".github/workflows/build.yml"]
  pull_request:
    paths: ["native/**"]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: windows-latest
    env:
      # whisper.cpp: Ninja instead of MSBuild (long paths in the Vulkan
      # shader build) and a short target dir
      CMAKE_GENERATOR: Ninja
      CARGO_TARGET_DIR: C:/t
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: seanmiddleditch/gha-setup-ninja@v5
      - name: Vulkan SDK (LunarG installer, silent)
        shell: pwsh
        run: |
          Invoke-WebRequest "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan_sdk.exe" -OutFile "$env:RUNNER_TEMP\vulkan_sdk.exe"
          & "$env:RUNNER_TEMP\vulkan_sdk.exe" --root C:\VulkanSDK --accept-licenses --default-answer --confirm-command install | Out-Null
          if (-not (Test-Path C:\VulkanSDK\Include\vulkan\vulkan.h)) { throw "Vulkan SDK not installed" }
          "VULKAN_SDK=C:\VulkanSDK" >> $env:GITHUB_ENV
          "C:\VulkanSDK\Bin" >> $env:GITHUB_PATH
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native -> C:/t
      - name: Test
        working-directory: native
        run: cargo test --workspace
      - name: Build
        working-directory: native
        run: cargo build --release --workspace
      - uses: actions/upload-artifact@v4
        with:
          name: claudetalk-bin
          path: |
            C:/t/release/claudetalk.exe
            C:/t/release/claudetalk-dictation.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            C:/t/release/claudetalk.exe
            C:/t/release/claudetalk-dictation.exe

      - name: Refresh bin/
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: Copy-Item C:/t/release/claudetalk.exe bin/ -Force
      - uses: peter-evans/create-pull-request@v6
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          branch: ci/bin-${{ github.ref_name }}
          base: main
          title: "bin: CI build of ${{ github.ref_name }}"
          body: Binaries in bin/ rebuilt by CI from the ${{ github.ref_name }} sources.
          commit-message: "chore: bin/ from CI build of ${{ github.ref_name }}"
          add-paths: bin/claudetalk.exe
